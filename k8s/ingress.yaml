apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: developer-api-portal
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: developer-portal.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: developer-portal-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: developer-portal-frontend
                port:
                  number: 80
