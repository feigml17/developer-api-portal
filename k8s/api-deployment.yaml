apiVersion: apps/v1
kind: Deployment
metadata:
  name: developer-portal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: developer-portal-api
  template:
    metadata:
      labels:
        app: developer-portal-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-account/developer-api-portal-api:latest
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: developer-portal-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

